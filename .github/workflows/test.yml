# The suite, where a stranger can see it run: every push and every pull request, on three Pythons.
# Standard library only: nothing is installed, the tests run from the tree. No secrets, read-only token.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04          # pinned: Python 3.9 is not built for newer runner images
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1        # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97    # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: The suite
        run: python -W ignore -m unittest discover -s tests
